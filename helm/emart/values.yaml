# Common labels added to every resource's metadata (not to selectors)
commonLabels: {}

client:
  enabled: true
  replicas: 1
  image:
    repository: abroor/emart-client
    tag: 21e46e8e3c8bb944bdbe23e845c120ccf9e0a75a
    pullPolicy: IfNotPresent
  containerPort: 4200
  service:
    name: client
    port: 4200
  resources: {}

javaapi:
  enabled: true
  replicas: 1
  image:
    repository: abroor/emart-javaapi
    tag: 4aa2cd510c115275c9c12c08ba15418cab5076c0
    pullPolicy: IfNotPresent
  containerPort: 9000
  service:
    name: webapi
    port: 9000
  resources: {}

nodeapi:
  enabled: true
  replicas: 1
  image:
    repository: abroor/emart-nodeapi
    tag: 21e46e8e3c8bb944bdbe23e845c120ccf9e0a75a
    pullPolicy: IfNotPresent
  containerPort: 5000
  service:
    name: api
    port: 5000
  resources: {}

mongodb:
  enabled: true
  name: emongo
  replicas: 1
  image:
    repository: mongo
    tag: "4"
    pullPolicy: IfNotPresent
  containerPort: 27017
  database: epoc
  service:
    port: 27017
  resources: {}

mysql:
  enabled: true
  name: emartdb
  replicas: 1
  image:
    repository: mysql
    tag: 8.0.33
    pullPolicy: IfNotPresent
  containerPort: 3306
  database: books
  service:
    port: 3306
  secret:
    name: mysql-secret
    # false: the chart expects an existing secret, created outside git:
    #   kubectl create secret generic mysql-secret -n emart --from-literal=password=<password>
    # true: the chart creates it; pass the value with --set mysql.secret.password=...
    create: false
  persistence:
    claimName: mysql-pvc
    storageClassName: gp2
    accessMode: ReadWriteOnce
    size: 5Gi
  resources: {}

# Replaced by the ALB Ingress below; set enabled: true (and ingress.enabled: false)
# to go back to nginx behind a Classic Load Balancer.
nginx:
  enabled: false
  replicas: 1
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  configMapName: nginx-config
  service:
    name: nginx
    type: LoadBalancer
    port: 80
  resources: {}

# ALB created by the AWS Load Balancer Controller (installed by emart-eks-terraform)
ingress:
  enabled: true
  name: emart
  className: alb
  # ExternalDNS creates these records in Route 53. Leave empty to serve on the
  # ALB's own address over HTTP only (then also drop HTTPS from listen-ports).
  hosts:
    - registan.xyz
    - www.registan.xyz
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Send traffic straight to pod IPs (works with the Amazon VPC CNI)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Health checks hit "/" on every service; the APIs may answer 404 there
    alb.ingress.kubernetes.io/success-codes: "200-499"
