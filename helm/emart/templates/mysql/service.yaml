{{- with .Values.mysql }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ .name }}
    {{- include "emart.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ .name }}
  ports:
  - port: {{ .service.port }}
    targetPort: {{ .containerPort }}
{{- end }}
{{- end }}
