apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapi
  namespace: emart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodeapi
  template:
    metadata:
      labels:
        app: nodeapi
    spec:
      containers:
      - name: nodeapi
        image: abroor/emart-nodeapi:fix1
        ports:
        - containerPort: 5000
