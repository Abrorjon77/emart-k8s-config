{{- with .Values.mysql }}
{{- if and .enabled .secret.externalSecret.enabled }}
# Where to read secrets from. No auth block: External Secrets Operator uses its
# own IAM role (IRSA), which emart-eks-terraform limits to the emart secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "emart.labels" $ | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .secret.externalSecret.region }}
---
# Creates the Kubernetes Secret the MySQL Deployment reads, from Secrets Manager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secret.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "emart.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .secret.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: {{ .secret.name }}
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: {{ .secret.externalSecret.remoteKey }}
      property: password
{{- end }}
{{- end }}
