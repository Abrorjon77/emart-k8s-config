apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapi
  namespace: emart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodeapi
  template:
    metadata:
      labels:
        app: nodeapi
    spec:
      containers:
      - name: nodeapi
        image: abroor/emart-nodeapi:4e6399e34941f8fee1d03803001274e7d44725fb
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: emart
spec:
  selector:
    app: nodeapi
  ports:
  - port: 5000
    targetPort: 5000