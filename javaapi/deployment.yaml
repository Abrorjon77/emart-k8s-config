apiVersion: apps/v1
kind: Deployment
metadata:
  name: javaapi
  namespace: emart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: javaapi
  template:
    metadata:
      labels:
        app: javaapi
    spec:
      containers:
      - name: javaapi
        image: abroor/emart-javaapi:4aa2cd510c115275c9c12c08ba15418cab5076c0
        ports:
        - containerPort: 9000
