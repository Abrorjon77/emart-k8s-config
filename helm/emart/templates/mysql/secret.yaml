{{- with .Values.mysql }}
{{- if and .enabled .secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .secret.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "emart.labels" $ | nindent 4 }}
type: Opaque
data:
  password: {{ required "mysql.secret.password is required" .secret.password | b64enc | quote }}
{{- end }}
{{- end }}
