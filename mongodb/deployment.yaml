apiVersion: apps/v1
kind: Deployment
metadata:
  name: emongo
  namespace: emart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: emongo
  template:
    metadata:
      labels:
        app: emongo
    spec:
      containers:
      - name: mongo
        image: mongo:4
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_DATABASE
          value: epoc
