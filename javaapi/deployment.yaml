apiVersion: apps/v1
kind: Deployment
metadata:
  name: javaapi
  namespace: emart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: javaapi
  template:
    metadata:
      labels:
        app: javaapi
    spec:
      containers:
      - name: javaapi
        image: abroor/emart-javaapi:f1ea5eab5da1e755f816ea0a4eaf897f1337b094
        ports:
        - containerPort: 9000
