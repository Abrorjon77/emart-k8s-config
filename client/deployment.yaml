apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: emart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: abroor/emart-client:f1ea5eab5da1e755f816ea0a4eaf897f1337b094
        ports:
        - containerPort: 4200
