apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: emart
data:
  default.conf: |
    upstream client {
      server client:4200;
    }
    upstream api {
      server api:5000;
    }
    upstream webapi {
      server webapi:9000;
    }
    server {
      listen 80;
      location / {
        proxy_pass http://client;
      }
      location /api {
        proxy_pass http://api;
      }
      location /webapi {
        proxy_pass http://webapi;
      }
    }